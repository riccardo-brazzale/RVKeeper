{% extends "base.html" %}

{% block title %}Recupero password - RVKeeper{% endblock %}

{% block content %}
<div class="panel login-panel">
  <h2>Recupera la password</h2>
  <p>Inserisci l'indirizzo email associato al tuo account. Ti invieremo le istruzioni per impostare una nuova password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="width:100%">Invia istruzioni</button>
  </form>
</div>
{% endblock %}
